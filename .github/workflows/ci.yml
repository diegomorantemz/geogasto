name: CI

on:
  push:
    branches: [master, diego-dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Ejecutar pruebas y cobertura
        run: ./mvnw -B verify

      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          if-no-files-found: ignore

      - name: Publicar reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          if-no-files-found: ignore

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t geogasto:ci .

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: geogasto_e2e
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d geogasto_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias E2E
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      - name: Construir aplicación
        run: ./mvnw -B -q -DskipTests package

      - name: Levantar aplicación
        env:
          DB_URL: jdbc:postgresql://localhost:5432/geogasto_e2e
          DB_USER: test
          DB_PASSWORD: test
          JWT_SECRET: test-secret-key-with-at-least-256-bits-for-e2e-1234567890
          RATE_LIMIT_ENABLED: 'false'
          SEED_DEFAULT_CATEGORIES: 'true'
          APP_UPLOADS_DIR: target/e2e-uploads
        run: |
          java -jar target/geogasto-*.jar --server.port=8081 > /tmp/geogasto-e2e.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:8081/actuator/health > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/geogasto-e2e.log
          exit 1

      - name: Ejecutar Playwright
        env:
          E2E_BASE_URL: http://localhost:8081
        run: npx playwright test

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
