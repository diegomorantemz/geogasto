<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Visualiza en el mapa dónde gastas tu dinero.">
    <title>Mapa de gastos - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="mapa"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Mapa de gastos</h2>
            <p class="text-muted mb-0">Descubre dónde se concentra tu dinero.</p>
        </div>
    </div>

    <div id="mapError" class="alert alert-danger py-2 d-none" role="alert"></div>

    <div class="card mb-3">
        <div class="card-body">
            <form id="mapFilterForm">
                <div class="row g-2 align-items-end">
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="mapFrom">Desde</label>
                        <input type="date" id="mapFrom" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small text-muted mb-1" for="mapTo">Hasta</label>
                        <input type="date" id="mapTo" class="form-control form-control-sm">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1" for="mapCategory">Categoría</label>
                        <select id="mapCategory" class="form-select form-select-sm">
                            <option value="">Todas las categorías</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label small text-muted mb-1" for="mapText">Buscar</label>
                        <input type="search" id="mapText" class="form-control form-control-sm"
                               placeholder="Descripción..." maxlength="255">
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary btn-sm flex-grow-1">
                            <i class="bi bi-funnel"></i> Aplicar
                        </button>
                        <button type="button" class="btn btn-outline-secondary btn-sm"
                                onclick="clearMapFilters()" title="Limpiar filtros" aria-label="Limpiar filtros">
                            <i class="bi bi-x-circle"></i>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="position-relative">
                <div id="expenseMap" class="map-page-shell"></div>

                <div class="map-overlay d-none" id="mapSummary">
                    <div class="stat-label">Total filtrado</div>
                    <div class="fs-5 fw-bold text-primary" id="mapTotal">0.00</div>
                    <div class="small text-muted" id="mapCount">0 gastos con ubicación</div>
                </div>

                <div class="map-empty d-none" id="mapEmpty">
                    <div class="text-center bg-white p-4 rounded-4 shadow-sm">
                        <i class="bi bi-geo-alt empty-icon"></i>
                        <h6 class="mt-2 mb-1">Sin gastos con ubicación</h6>
                        <p class="small text-muted mb-0">Prueba con otros filtros o registra un gasto nuevo.</p>
                    </div>
                </div>

                <div class="position-absolute top-50 start-50 translate-middle bg-white rounded-3 shadow-sm px-3 py-2 map-loading"
                     id="mapLoading">
                    <span class="spinner-border spinner-border-sm me-2"></span>Cargando mapa...
                </div>
            </div>
        </div>
    </div>

    <p class="small text-muted mt-3 mb-0" id="mapLimitNote">
        <i class="bi bi-info-circle"></i> Se muestran hasta 5000 gastos con ubicación.
    </p>

</main>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/map.js"></script>
</body>
</html>
