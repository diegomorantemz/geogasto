<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Registra tus ingresos y visualiza tu balance mensual.">
    <title>Ingresos - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="ingresos"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Ingresos</h2>
            <p class="text-muted mb-0">Registra lo que entra y compara con tus gastos.</p>
        </div>
        <button class="btn btn-primary" onclick="openNewIncomeModal()">
            <i class="bi bi-plus-circle"></i> Nuevo ingreso
        </button>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <div class="row g-3 mb-3">
        <div class="col-sm-4">
            <div class="card stat-card">
                <div class="card-body d-flex align-items-center justify-content-between gap-3">
                    <div>
                        <div class="stat-label">Ingresos del mes</div>
                        <p class="stat-value" id="incomeMonth">0.00</p>
                    </div>
                    <div class="stat-icon success"><i class="bi bi-cash-coin"></i></div>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card stat-card">
                <div class="card-body d-flex align-items-center justify-content-between gap-3">
                    <div>
                        <div class="stat-label">Gastos del mes</div>
                        <p class="stat-value" id="expenseMonth">0.00</p>
                    </div>
                    <div class="stat-icon danger"><i class="bi bi-receipt"></i></div>
                </div>
            </div>
        </div>
        <div class="col-sm-4">
            <div class="card stat-card">
                <div class="card-body d-flex align-items-center justify-content-between gap-3">
                    <div>
                        <div class="stat-label">Balance del mes</div>
                        <p class="stat-value" id="balanceMonth">0.00</p>
                    </div>
                    <div class="stat-icon purple"><i class="bi bi-wallet2"></i></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="incomeFrom">Desde</label>
                    <input type="date" id="incomeFrom" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="incomeTo">Hasta</label>
                    <input type="date" id="incomeTo" class="form-control form-control-sm">
                </div>
                <div class="col-md-4">
                    <label class="form-label small text-muted mb-1" for="incomeText">Buscar</label>
                    <input type="search" id="incomeText" class="form-control form-control-sm"
                           placeholder="Descripción o fuente..." maxlength="255"
                           onkeydown="if (event.key === 'Enter') applyIncomeFilters()">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1" onclick="applyIncomeFilters()">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="clearIncomeFilters()"
                            title="Limpiar filtros" aria-label="Limpiar filtros">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 120px;">Fecha</th>
                        <th>Descripción</th>
                        <th style="width: 200px;">Fuente</th>
                        <th style="width: 140px;" class="text-end">Monto</th>
                        <th style="width: 120px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="incomesTable">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">Cargando ingresos...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="text-muted small" id="incomePageInfo">Página 1</div>
            <div>
                <button class="btn btn-sm btn-outline-secondary" id="incomePrevBtn" onclick="prevIncomePage()">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="incomeNextBtn" onclick="nextIncomePage()">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

</main>

<!-- Modal -->
<div class="modal fade" id="incomeModal" tabindex="-1" aria-labelledby="incomeModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="incomeForm" onsubmit="handleSaveIncome(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="incomeModalTitle">Nuevo ingreso</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="incomeId">

                    <div class="row">
                        <div class="col-md-7 mb-3">
                            <label for="incomeMonto" class="form-label">Monto</label>
                            <input type="number" id="incomeMonto" class="form-control" required
                                   step="0.01" min="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label for="incomeFecha" class="form-label">Fecha</label>
                            <input type="date" id="incomeFecha" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="incomeDescripcion" class="form-label">Descripción</label>
                        <input type="text" id="incomeDescripcion" class="form-control" maxlength="255"
                               placeholder="Ej: Salario de noviembre">
                    </div>

                    <div class="mb-3">
                        <label for="incomeFuente" class="form-label">Fuente</label>
                        <input type="text" id="incomeFuente" class="form-control" maxlength="100"
                               placeholder="Ej: Salario, Freelance, Ventas">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="incomeSaveBtn">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/incomes.js"></script>
</body>
</html>
