<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en GeoGasto.">
    <meta name="theme-color" content="#f3f1ec">
    <title>Crear cuenta · GeoGasto</title>
    <script src="/js/theme.js"></script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
    <div class="auth-texture" aria-hidden="true"></div>

    <header class="auth-topbar">
        <a class="auth-brand" href="/index.html" aria-label="GeoGasto, ir al inicio">
            <span class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M16.6 8.6a5.7 5.7 0 1 0 0 6.8M16.6 12h-4"
                          stroke="currentColor" stroke-width="1.7"
                          stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="auth-wordmark">GeoGasto</span>
        </a>

        <button type="button" class="theme-toggle" id="themeToggle" data-theme-toggle
                aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
            <span class="theme-icon theme-icon-moon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <path d="M20 14.6A8.1 8.1 0 0 1 9.4 4a8.3 8.3 0 1 0 10.6 10.6Z"
                          stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                </svg>
            </span>
            <span class="theme-icon theme-icon-sun" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                    <circle cx="12" cy="12" r="3.6" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M12 2.8v2M12 19.2v2M21.2 12h-2M4.8 12h-2M18.5 5.5l-1.4 1.4M6.9 17.1l-1.4 1.4M18.5 18.5l-1.4-1.4M6.9 6.9 5.5 5.5"
                          stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
            </span>
        </button>
    </header>

    <main class="auth-main">
        <section class="auth-card" aria-labelledby="authTitle">
            <p class="auth-eyebrow">Registro</p>
            <h1 class="auth-title" id="authTitle">Crea tu cuenta</h1>
            <p class="auth-subtitle">Solo necesitas un email y una contraseña. El resto lo configuras después.</p>

            <div id="errorBox" class="auth-alert d-none" role="alert" aria-live="assertive"></div>

            <form class="auth-form" onsubmit="handleRegister(event)" novalidate>
                <div class="field">
                    <label class="field-label" for="nombre">Nombre completo</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="8" r="3.5" stroke="currentColor" stroke-width="1.6"/>
                                <path d="M5 19.2c.7-3.1 3.5-5 7-5s6.3 1.9 7 5"
                                      stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <input type="text" id="nombre" name="nombre" class="form-control"
                               placeholder="Tu nombre" required maxlength="100" autofocus
                               autocomplete="name" aria-describedby="nombreError">
                    </div>
                    <p class="field-error" id="nombreError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label class="field-label" for="email">Email</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="3.5" y="5.5" width="17" height="13" rx="2.5"
                                      stroke="currentColor" stroke-width="1.6"/>
                                <path d="m4.5 7 7.5 5.5L19.5 7" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <input type="email" id="email" name="email" class="form-control"
                               placeholder="tu@email.com" required maxlength="100"
                               autocomplete="email" aria-describedby="emailError">
                    </div>
                    <p class="field-error" id="emailError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label class="field-label" for="password">Contraseña</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="4.5" y="10" width="15" height="10" rx="2.5"
                                      stroke="currentColor" stroke-width="1.6"/>
                                <path d="M8 10V7.5a4 4 0 0 1 8 0V10" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round"/>
                                <circle cx="12" cy="15" r="1.2" fill="currentColor"/>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" class="form-control"
                               placeholder="Mínimo 8 caracteres" required minlength="8" maxlength="72"
                               autocomplete="new-password" aria-describedby="passwordError passwordStrengthLabel">
                        <button type="button" class="password-toggle"
                                onclick="togglePassword('password', this)"
                                aria-label="Mostrar contraseña" title="Mostrar contraseña">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M2.8 12S6.2 6.5 12 6.5 21.2 12 21.2 12 17.8 17.5 12 17.5 2.8 12 2.8 12Z"
                                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/>
                            </svg>
                        </button>
                    </div>
                    <p class="field-error" id="passwordError" aria-live="polite"></p>
                    <div class="password-strength" id="passwordStrength" aria-live="polite">
                        <span class="strength-bars" aria-hidden="true">
                            <span></span><span></span><span></span><span></span>
                        </span>
                        <span class="strength-label" id="passwordStrengthLabel">Mínimo 8 caracteres</span>
                    </div>
                </div>

                <div class="field">
                    <label class="field-label" for="confirmPassword">Confirmar contraseña</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <rect x="4.5" y="10" width="15" height="10" rx="2.5"
                                      stroke="currentColor" stroke-width="1.6"/>
                                <path d="M8 10V7.5a4 4 0 0 1 8 0V10" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round"/>
                                <path d="m9.4 15 1.7 1.7 3.5-3.5" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
                               placeholder="Repite tu contraseña" required minlength="8" maxlength="72"
                               autocomplete="new-password" aria-describedby="confirmPasswordError">
                        <button type="button" class="password-toggle"
                                onclick="togglePassword('confirmPassword', this)"
                                aria-label="Mostrar confirmación de contraseña"
                                title="Mostrar confirmación de contraseña">
                            <svg viewBox="0 0 24 24" fill="none">
                                <path d="M2.8 12S6.2 6.5 12 6.5 21.2 12 21.2 12 17.8 17.5 12 17.5 2.8 12 2.8 12Z"
                                      stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                                <circle cx="12" cy="12" r="2.7" stroke="currentColor" stroke-width="1.6"/>
                            </svg>
                        </button>
                    </div>
                    <p class="field-error" id="confirmPasswordError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label class="field-label" for="moneda">Moneda</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6"/>
                                <path d="M14.5 9.2c-.5-.6-1.3-1-2.4-1-1.4 0-2.4.8-2.4 1.9 0 1.2 1.1 1.7 2.5 1.9 1.5.2 2.5.7 2.5 1.9s-1.1 1.9-2.6 1.9c-1.1 0-2-.4-2.6-1.1M12 6.8v10.4"
                                      stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                            </svg>
                        </span>
                        <select id="moneda" name="moneda" class="form-select" required
                                aria-describedby="monedaError">
                            <option value="PEN" selected>PEN · Sol peruano</option>
                            <option value="USD">USD · Dólar</option>
                            <option value="EUR">EUR · Euro</option>
                            <option value="MXN">MXN · Peso mexicano</option>
                            <option value="COP">COP · Peso colombiano</option>
                            <option value="ARS">ARS · Peso argentino</option>
                            <option value="CLP">CLP · Peso chileno</option>
                            <option value="BRL">BRL · Real</option>
                        </select>
                        <span class="select-chevron" aria-hidden="true">
                            <svg viewBox="0 0 20 20" fill="none">
                                <path d="m5.5 7.5 4.5 4.5 4.5-4.5" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                    <p class="field-error" id="monedaError" aria-live="polite"></p>
                </div>

                <div class="field">
                    <label class="field-label" for="timezone">Zona horaria</label>
                    <div class="field-control">
                        <span class="field-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none">
                                <circle cx="12" cy="12" r="7.5" stroke="currentColor" stroke-width="1.6"/>
                                <path d="M4.7 12h14.6M12 4.5c2 2 3 4.6 3 7.5s-1 5.5-3 7.5c-2-2-3-4.6-3-7.5s1-5.5 3-7.5Z"
                                      stroke="currentColor" stroke-width="1.6"/>
                            </svg>
                        </span>
                        <select id="timezone" name="timezone" class="form-select" required
                                aria-describedby="timezoneError">
                            <option value="America/Lima" selected>Lima · UTC-5</option>
                            <option value="America/Bogota">Bogotá · UTC-5</option>
                            <option value="America/Mexico_City">Ciudad de México · UTC-6</option>
                            <option value="America/Santiago">Santiago · UTC-3/-4</option>
                            <option value="America/Argentina/Buenos_Aires">Buenos Aires · UTC-3</option>
                            <option value="America/Sao_Paulo">São Paulo · UTC-3</option>
                            <option value="Europe/Madrid">Madrid · UTC+1/+2</option>
                            <option value="UTC">UTC</option>
                        </select>
                        <span class="select-chevron" aria-hidden="true">
                            <svg viewBox="0 0 20 20" fill="none">
                                <path d="m5.5 7.5 4.5 4.5 4.5-4.5" stroke="currentColor"
                                      stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </span>
                    </div>
                    <p class="field-error" id="timezoneError" aria-live="polite"></p>
                </div>

                <button type="submit" class="btn auth-submit" id="registerBtn">
                    <span>Crear cuenta</span>
                    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true">
                        <path d="M4 10h12M11 5l5 5-5 5" stroke="currentColor" stroke-width="1.6"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
            </form>

            <div class="auth-divider" aria-hidden="true"></div>

            <p class="auth-switch">¿Ya tienes cuenta? <a href="/login.html">Inicia sesión</a></p>
        </section>

        <p class="auth-footnote">Tus datos se guardan de forma segura.</p>
    </main>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
