<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en GeoGasto.">
    <title>Registrarse - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">

<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-7 col-lg-5">
            <div class="card auth-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="auth-logo"><i class="bi bi-person-plus"></i></div>
                    <h3 class="text-center mb-1 fw-bold">Crea tu cuenta</h3>
                    <p class="text-center text-muted mb-4">Empieza a entender dónde gastas.</p>

                    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

                    <form onsubmit="handleRegister(event)">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input type="text" id="nombre" name="nombre" class="form-control"
                                   required maxlength="100" autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   required maxlength="100" autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   required minlength="8" maxlength="72" autocomplete="new-password">
                            <div class="form-text">Mínimo 8 caracteres.</div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="moneda" class="form-label">Moneda</label>
                                <select id="moneda" name="moneda" class="form-select">
                                    <option value="PEN" selected>PEN (S/)</option>
                                    <option value="USD">USD ($)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="MXN">MXN ($)</option>
                                    <option value="COP">COP ($)</option>
                                    <option value="ARS">ARS ($)</option>
                                    <option value="CLP">CLP ($)</option>
                                    <option value="BRL">BRL (R$)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="timezone" class="form-label">Zona horaria</label>
                                <select id="timezone" name="timezone" class="form-select">
                                    <option value="America/Lima" selected>Lima (UTC-5)</option>
                                    <option value="America/Bogota">Bogotá (UTC-5)</option>
                                    <option value="America/Mexico_City">Ciudad de México (UTC-6)</option>
                                    <option value="America/Santiago">Santiago (UTC-3/-4)</option>
                                    <option value="America/Argentina/Buenos_Aires">Buenos Aires (UTC-3)</option>
                                    <option value="America/Sao_Paulo">São Paulo (UTC-3)</option>
                                    <option value="Europe/Madrid">Madrid (UTC+1/+2)</option>
                                    <option value="UTC">UTC</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-person-plus"></i> Crear cuenta
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        ¿Ya tienes cuenta?
                        <a href="/login.html" class="fw-semibold">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
