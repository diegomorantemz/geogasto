<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Configura tu perfil, moneda y zona horaria.">
    <title>Mi perfil - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="perfil"></div>

<main class="container py-4">

    <div class="mb-4">
        <h2 class="page-title mb-1">Mi perfil</h2>
        <p class="text-muted mb-0">Configura tus datos, moneda y zona horaria.</p>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <div class="row g-4">
        <div class="col-lg-4">
            <div class="card h-100">
                <div class="card-body text-center p-4">
                    <div class="avatar-circle mx-auto mb-3" id="profileAvatar">G</div>
                    <h5 class="mb-1" id="profileDisplayName">Mi cuenta</h5>
                    <p class="text-muted small mb-3" id="profileDisplayEmail"></p>
                    <span class="badge-soft">
                        <i class="bi bi-shield-check text-success"></i> Cuenta protegida con JWT
                    </span>
                </div>
            </div>
        </div>

        <div class="col-lg-8">
            <div class="card mb-4">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Datos personales</h5>
                    <form id="profileForm" onsubmit="handleSaveProfile(event)">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="profileNombre" class="form-label">Nombre</label>
                                <input type="text" id="profileNombre" class="form-control" required maxlength="100">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="profileEmail" class="form-label">Email</label>
                                <input type="email" id="profileEmail" class="form-control" disabled>
                                <div class="form-text">El email no se puede cambiar desde aquí.</div>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="profileMoneda" class="form-label">Moneda</label>
                                <select id="profileMoneda" class="form-select">
                                    <option value="USD">USD ($)</option>
                                    <option value="PEN">PEN (S/)</option>
                                    <option value="EUR">EUR (€)</option>
                                    <option value="MXN">MXN ($)</option>
                                    <option value="COP">COP ($)</option>
                                    <option value="ARS">ARS ($)</option>
                                    <option value="CLP">CLP ($)</option>
                                    <option value="BRL">BRL (R$)</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="profileTimezone" class="form-label">Zona horaria</label>
                                <select id="profileTimezone" class="form-select">
                                    <option value="America/Lima">Lima (UTC-5)</option>
                                    <option value="America/Bogota">Bogotá (UTC-5)</option>
                                    <option value="America/Mexico_City">Ciudad de México (UTC-6)</option>
                                    <option value="America/Santiago">Santiago (UTC-3/-4)</option>
                                    <option value="America/Argentina/Buenos_Aires">Buenos Aires (UTC-3)</option>
                                    <option value="America/Sao_Paulo">São Paulo (UTC-3)</option>
                                    <option value="Europe/Madrid">Madrid (UTC+1/+2)</option>
                                    <option value="UTC">UTC</option>
                                </select>
                                <div class="form-text">Se usa para calcular los meses en el dashboard.</div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary" id="profileSaveBtn">
                            <i class="bi bi-check2"></i> Guardar cambios
                        </button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-body p-4">
                    <h5 class="card-title mb-3">Cambiar contraseña</h5>
                    <form id="passwordForm" onsubmit="handleChangePassword(event)">
                        <div class="row">
                            <div class="col-md-4 mb-3">
                                <label for="currentPassword" class="form-label">Contraseña actual</label>
                                <input type="password" id="currentPassword" class="form-control" required
                                       autocomplete="current-password">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="newPassword" class="form-label">Nueva contraseña</label>
                                <input type="password" id="newPassword" class="form-control" required
                                       minlength="8" maxlength="72" autocomplete="new-password">
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="confirmPassword" class="form-label">Confirmar contraseña</label>
                                <input type="password" id="confirmPassword" class="form-control" required
                                       minlength="8" maxlength="72" autocomplete="new-password">
                            </div>
                        </div>
                        <button type="submit" class="btn btn-outline-primary" id="passwordSaveBtn">
                            <i class="bi bi-key"></i> Actualizar contraseña
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/profile.js"></script>
</body>
</html>
