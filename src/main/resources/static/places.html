<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gestiona tus lugares frecuentes en GeoGasto.">
    <title>Lugares guardados - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script src="/js/theme.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="lugares"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Lugares guardados</h2>
            <p class="text-muted mb-0">Tus lugares frecuentes para registrar gastos más rápido.</p>
        </div>
        <a href="/new-expense.html" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Agregar lugar
        </a>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 responsive-table">
                    <thead>
                    <tr>
                        <th style="width: 220px;">Alias</th>
                        <th>Dirección</th>
                        <th style="width: 180px;">Ciudad</th>
                        <th style="width: 100px;" class="text-center">Usos</th>
                        <th style="width: 120px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="placesTable">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">Cargando lugares...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="small text-muted mt-3 mb-0">
        <i class="bi bi-info-circle"></i>
        Para crear un lugar, selecciona una ubicación en <a href="/new-expense.html">Nuevo gasto</a>
        y pulsa “Guardar como lugar favorito”.
    </p>

</main>

<!-- Modal -->
<div class="modal fade" id="placeModal" tabindex="-1" aria-labelledby="placeModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="placeForm" onsubmit="handleSavePlace(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="placeModalTitle">Renombrar lugar</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="placeId">
                    <label for="placeAlias" class="form-label">Alias</label>
                    <input type="text" id="placeAlias" class="form-control" required maxlength="50"
                           placeholder="Ej: Casa, Trabajo, Súper">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="placeSaveBtn">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/places.js"></script>
</body>
</html>
