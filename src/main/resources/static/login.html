<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Inicia sesión en GeoGasto.">
    <title>Iniciar sesión - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-6 col-lg-4">
            <div class="card auth-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="auth-logo"><i class="bi bi-wallet2"></i></div>
                    <h3 class="text-center mb-1 fw-bold">GeoGasto</h3>
                    <p class="text-center text-muted mb-4">Administra tus gastos con ubicación</p>

                    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control"
                                   required autofocus autocomplete="email" maxlength="100">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   required autocomplete="current-password" maxlength="72">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        ¿No tienes cuenta?
                        <a href="/register.html" class="fw-semibold">Regístrate</a>
                    </p>
                </div>
            </div>
            <p class="text-center text-muted small mt-3 mb-0">
                Hecho para entender mejor en qué y dónde gastas.
            </p>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
