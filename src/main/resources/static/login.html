<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - GeoGasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h3 class="text-center mb-1">
                        <i class="bi bi-wallet2 text-primary"></i> GeoGasto
                    </h3>
                    <p class="text-center text-muted mb-4">Administra tus gastos con ubicación</p>

                    <div id="registeredBox" class="alert alert-success py-2 d-none">
                        Cuenta creada. Ahora puedes iniciar sesión.
                    </div>

                    <div id="errorBox" class="alert alert-danger py-2 d-none"></div>

                    <form onsubmit="handleLogin(event)">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" name="email" class="form-control" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <input type="password" id="password" name="password" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                        </button>
                    </form>

                    <hr class="my-4">

                    <p class="text-center mb-0">
                        ¿No tienes cuenta?
                        <a href="/register.html">Regístrate</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script>
    if (new URLSearchParams(window.location.search).get('registered') === 'true') {
        document.getElementById('registeredBox').classList.remove('d-none');
    }
</script>

</body>
</html>
