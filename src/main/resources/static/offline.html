<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sin conexión - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="auth-page">
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="col-md-6 col-lg-4 text-center">
            <div class="card auth-card shadow-sm">
                <div class="card-body p-4 p-md-5">
                    <div class="auth-logo"><i class="bi bi-wifi-off"></i></div>
                    <h3 class="mb-2">Sin conexión</h3>
                    <p class="text-muted">No pudimos conectar con GeoGasto. Revisa tu red y vuelve a intentarlo.</p>
                    <button class="btn btn-primary w-100" onclick="window.location.reload()">
                        <i class="bi bi-arrow-clockwise"></i> Reintentar
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
