<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo gasto - GeoGasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-wallet2"></i> GeoGasto
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">
                        <i class="bi bi-house"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/expenses.html">
                        <i class="bi bi-list-ul"></i> Gastos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/categories.html">
                        <i class="bi bi-tags"></i> Categorías
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i>
                    <span id="userEmail"></span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">

    <div class="mb-4">
        <h2 class="mb-1">Nuevo gasto</h2>
        <p class="text-muted mb-0">Registra un gasto y asigna su ubicación</p>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none"></div>

    <div class="row g-4">

        <!-- Columna izquierda: formulario -->
        <div class="col-lg-5">
            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form id="newExpenseForm" onsubmit="handleSubmit(event)">

                        <h6 class="text-muted mb-3">Datos del gasto</h6>

                        <div class="row">
                            <div class="col-7 mb-3">
                                <label for="monto" class="form-label">Monto (S/)</label>
                                <input type="number" id="monto" class="form-control" required
                                       step="0.01" min="0.01" placeholder="0.00">
                            </div>
                            <div class="col-5 mb-3">
                                <label for="fecha" class="form-label">Fecha</label>
                                <input type="date" id="fecha" class="form-control" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" id="descripcion" class="form-control" maxlength="255"
                                   placeholder="Ej: Compra semanal">
                        </div>

                        <div class="mb-4">
                            <label for="categoryId" class="form-label">Categoría</label>
                            <select id="categoryId" class="form-select">
                                <option value="">Sin categoría</option>
                            </select>
                        </div>

                        <hr>

                        <h6 class="text-muted mb-3">
                            <i class="bi bi-geo-alt"></i> Ubicación
                        </h6>

                        <!-- Lugares guardados -->
                        <div class="mb-3">
                            <label class="form-label">Lugares guardados</label>
                            <div id="savedPlacesChips" class="d-flex flex-wrap gap-2">
                                <span class="text-muted small">Cargando...</span>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="searchPlace" class="form-label">Buscar lugar</label>
                            <div class="position-relative">
                                <input type="text" id="searchPlace" class="form-control"
                                       placeholder="Ej: Plaza Vea Miraflores, Starbucks..."
                                       autocomplete="off">
                                <div id="searchResults" class="list-group position-absolute w-100 shadow-sm d-none"
                                     style="z-index: 1000; max-height: 250px; overflow-y: auto;"></div>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mb-3">
                            <button type="button" class="btn btn-outline-primary btn-sm" onclick="useCurrentLocation()">
                                <i class="bi bi-crosshair"></i> Usar mi ubicación actual
                            </button>
                        </div>

                        <div id="selectedLocation" class="d-none">
                            <div class="alert alert-info py-2 mb-2">
                                <div class="small">
                                    <strong>Ubicación seleccionada:</strong><br>
                                    <span id="locationDisplay"></span>
                                </div>
                            </div>

                            <button type="button" class="btn btn-outline-success btn-sm w-100 mb-2"
                                    onclick="saveAsFavorite()">
                                <i class="bi bi-bookmark-plus"></i> Guardar como lugar favorito
                            </button>

                            <button type="button" class="btn btn-outline-danger btn-sm w-100 mb-3"
                                    onclick="clearLocation()">
                                <i class="bi bi-x-circle"></i> Quitar ubicación
                            </button>
                        </div>

                        <div class="d-flex gap-2 mt-4">
                            <a href="/expenses.html" class="btn btn-secondary flex-grow-1">
                                <i class="bi bi-x-circle"></i> Cancelar
                            </a>
                            <button type="submit" class="btn btn-primary flex-grow-1">
                                <i class="bi bi-check2-circle"></i> Guardar
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>

        <!-- Columna derecha: mapa -->
        <div class="col-lg-7">
            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="p-3 border-bottom">
                        <h6 class="mb-0">
                            <i class="bi bi-map"></i> Selecciona la ubicación en el mapa
                        </h6>
                        <small class="text-muted">Haz clic en el mapa para marcar un punto</small>
                    </div>
                    <div id="map" style="height: 520px; border-radius: 0 0 .5rem .5rem;"></div>
                </div>
            </div>
        </div>

    </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/new-expense.js"></script>

</body>
</html>0
