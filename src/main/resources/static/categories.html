<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categorías - GeoGasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-wallet2"></i> GeoGasto
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">
                        <i class="bi bi-house"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/expenses.html">
                        <i class="bi bi-list-ul"></i> Gastos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/categories.html">
                        <i class="bi bi-tags"></i> Categorías
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i>
                    <span id="userEmail"></span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Categorías</h2>
            <p class="text-muted mb-0">Organiza tus gastos por tipo</p>
        </div>
        <button class="btn btn-primary" onclick="openNewCategoryModal()">
            <i class="bi bi-plus-circle"></i> Nueva categoría
        </button>
    </div>

    <!-- Alerts -->
    <div id="successBox" class="alert alert-success py-2 d-none"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none"></div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">Color</th>
                        <th>Nombre</th>
                        <th style="width: 80px;">Icono</th>
                        <th style="width: 180px;">Creada</th>
                        <th style="width: 140px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="categoriesTable">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">
                            Cargando categorías...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="categoryForm" onsubmit="handleSaveCategory(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">Nueva categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="categoryId">

                    <div class="mb-3">
                        <label for="categoryNombre" class="form-label">Nombre</label>
                        <input type="text" id="categoryNombre" class="form-control" required maxlength="50"
                               placeholder="Ej: Comida, Transporte, Hogar">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="categoryColor" class="form-label">Color</label>
                            <input type="color" id="categoryColor" class="form-control form-control-color w-100"
                                   value="#0d6efd">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoryIcono" class="form-label">Icono (opcional)</label>
                            <input type="text" id="categoryIcono" class="form-control" maxlength="50"
                                   placeholder="Ej: bi-cart, bi-car-front">
                            <div class="form-text">Clase de Bootstrap Icons.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/categories.js"></script>

</body>
</html>
