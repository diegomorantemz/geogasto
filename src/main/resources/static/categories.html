<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Organiza tus gastos con categorías personalizadas.">
    <title>Categorías - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="categorias"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Categorías</h2>
            <p class="text-muted mb-0">Organiza tus gastos por tipo.</p>
        </div>
        <button class="btn btn-primary" onclick="openNewCategoryModal()">
            <i class="bi bi-plus-circle"></i> Nueva categoría
        </button>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 60px;">Color</th>
                        <th>Nombre</th>
                        <th style="width: 80px;">Icono</th>
                        <th style="width: 180px;">Creada</th>
                        <th style="width: 120px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="categoriesTable">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">Cargando categorías...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <p class="small text-muted mt-3 mb-0">
        <i class="bi bi-info-circle"></i>
        Las categorías con gastos asociados no se pueden eliminar.
    </p>

</main>

<!-- Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="categoryForm" onsubmit="handleSaveCategory(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalTitle">Nueva categoría</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="categoryId">

                    <div class="mb-3">
                        <label for="categoryNombre" class="form-label">Nombre</label>
                        <input type="text" id="categoryNombre" class="form-control" required maxlength="50"
                               placeholder="Ej: Comida, Transporte, Hogar">
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="categoryColor" class="form-label">Color</label>
                            <input type="color" id="categoryColor" class="form-control form-control-color w-100"
                                   value="#2563eb">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="categoryIcono" class="form-label">Icono (opcional)</label>
                            <input type="text" id="categoryIcono" class="form-control" maxlength="50"
                                   placeholder="Ej: bi-cart, bi-car-front">
                            <div class="form-text">Clase de Bootstrap Icons.</div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="categorySaveBtn">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/categories.js"></script>
</body>
</html>
