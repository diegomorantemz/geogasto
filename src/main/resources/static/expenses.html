<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta, filtra y exporta tus gastos.">
    <title>Gastos - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="gastos"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Mis gastos</h2>
            <p class="text-muted mb-0">Registra, filtra y exporta tus gastos.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" onclick="exportExpenses()">
                <i class="bi bi-download"></i> Exportar CSV
            </button>
            <button class="btn btn-primary" onclick="openNewExpenseModal()">
                <i class="bi bi-plus-circle"></i> Nuevo gasto
            </button>
        </div>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1" for="filterFrom">Desde</label>
                    <input type="date" id="filterFrom" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1" for="filterTo">Hasta</label>
                    <input type="date" id="filterTo" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="filterCategory">Categoría</label>
                    <select id="filterCategory" class="form-select form-select-sm">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="filterText">Buscar</label>
                    <input type="search" id="filterText" class="form-control form-control-sm"
                           placeholder="Descripción..." maxlength="255"
                           onkeydown="if (event.key === 'Enter') applyFilters()">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1" onclick="applyFilters()">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()"
                            title="Limpiar filtros" aria-label="Limpiar filtros">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 110px;">Fecha</th>
                        <th>Descripción</th>
                        <th style="width: 150px;">Categoría</th>
                        <th style="width: 230px;">Ubicación</th>
                        <th style="width: 130px;" class="text-end">Monto</th>
                        <th style="width: 120px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="expensesTable">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">Cargando gastos...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="text-muted small" id="pageInfo">Página 1</div>
            <div>
                <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="prevPage()">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="nextPage()">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

</main>

<!-- Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1" aria-labelledby="expenseModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="expenseForm" onsubmit="handleSaveExpense(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="expenseModalTitle">Nuevo gasto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="expenseId">
                    <input type="hidden" id="expenseLocationId">

                    <div class="row">
                        <div class="col-md-7 mb-3">
                            <label for="expenseMonto" class="form-label">Monto</label>
                            <input type="number" id="expenseMonto" class="form-control" required
                                   step="0.01" min="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label for="expenseFecha" class="form-label">Fecha</label>
                            <input type="date" id="expenseFecha" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="expenseDescripcion" class="form-label">Descripción</label>
                        <input type="text" id="expenseDescripcion" class="form-control" maxlength="255"
                               placeholder="Ej: Almuerzo en el centro">
                    </div>

                    <div class="mb-3">
                        <label for="expenseCategory" class="form-label">Categoría</label>
                        <select id="expenseCategory" class="form-select">
                            <option value="">Sin categoría</option>
                        </select>
                    </div>

                    <div id="expenseLocationBox" class="alert alert-info py-2 d-none">
                        <div class="d-flex justify-content-between align-items-center gap-2">
                            <span class="small">
                                <i class="bi bi-geo-alt"></i> <span id="expenseLocationText"></span>
                            </span>
                            <button type="button" class="btn btn-sm btn-link text-danger p-0"
                                    onclick="clearExpenseLocation()" title="Quitar ubicación">
                                Quitar
                            </button>
                        </div>
                    </div>

                    <p class="small text-muted mb-0">
                        Para agregar o cambiar la ubicación, usa
                        <a href="/new-expense.html">Nuevo gasto</a>.
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="expenseSaveBtn">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/expenses.js"></script>
</body>
</html>
