<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gastos - GeoGasto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/index.html">
            <i class="bi bi-wallet2"></i> GeoGasto
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/index.html">
                        <i class="bi bi-house"></i> Inicio
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/expenses.html">
                        <i class="bi bi-list-ul"></i> Gastos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/categories.html">
                        <i class="bi bi-tags"></i> Categorías
                    </a>
                </li>
            </ul>
            <div class="d-flex align-items-center">
                <span class="text-white me-3">
                    <i class="bi bi-person-circle"></i>
                    <span id="userEmail"></span>
                </span>
                <button class="btn btn-outline-light btn-sm" onclick="logout()">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </button>
            </div>
        </div>
    </div>
</nav>

<!-- Content -->
<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-1">Mis gastos</h2>
            <p class="text-muted mb-0">Registra y consulta tus gastos</p>
        </div>
        <button class="btn btn-primary" onclick="openNewExpenseModal()">
            <i class="bi bi-plus-circle"></i> Nuevo gasto
        </button>
    </div>

    <!-- Alerts -->
    <div id="successBox" class="alert alert-success py-2 d-none"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none"></div>

    <!-- Filters -->
    <div class="card shadow-sm border-0 mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1">Desde</label>
                    <input type="date" id="filterFrom" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1">Hasta</label>
                    <input type="date" id="filterTo" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1">Categoría</label>
                    <select id="filterCategory" class="form-select form-select-sm">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-md-3 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1" onclick="applyFilters()">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 110px;">Fecha</th>
                        <th>Descripción</th>
                        <th style="width: 180px;">Categoría</th>
                        <th style="width: 130px;" class="text-end">Monto</th>
                        <th style="width: 140px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="expensesTable">
                    <tr>
                        <td colspan="5" class="text-center py-4 text-muted">
                            Cargando gastos...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Pagination -->
        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
            <div class="text-muted small" id="pageInfo">Página 1</div>
            <div>
                <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="prevPage()">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="nextPage()">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

</div>

<!-- Modal -->
<div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="expenseForm" onsubmit="handleSaveExpense(event)">
                <div class="modal-header">
                    <h5 class="modal-title" id="expenseModalTitle">Nuevo gasto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="expenseId">

                    <div class="row">
                        <div class="col-md-7 mb-3">
                            <label for="expenseMonto" class="form-label">Monto (S/)</label>
                            <input type="number" id="expenseMonto" class="form-control" required
                                   step="0.01" min="0.01" placeholder="0.00">
                        </div>
                        <div class="col-md-5 mb-3">
                            <label for="expenseFecha" class="form-label">Fecha</label>
                            <input type="date" id="expenseFecha" class="form-control" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="expenseDescripcion" class="form-label">Descripción</label>
                        <input type="text" id="expenseDescripcion" class="form-control" maxlength="255"
                               placeholder="Ej: Almuerzo en el centro">
                    </div>

                    <div class="mb-3">
                        <label for="expenseCategory" class="form-label">Categoría</label>
                        <select id="expenseCategory" class="form-select">
                            <option value="">Sin categoría</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check2"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/expenses.js"></script>

</body>
</html>
