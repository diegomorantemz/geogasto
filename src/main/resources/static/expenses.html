<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Consulta, filtra y exporta tus gastos.">
    <title>Gastos - GeoGasto</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/app.css">
</head>
<body>

<div id="appNav" data-active="gastos"></div>

<main class="container py-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h2 class="page-title mb-1">Mis gastos</h2>
            <p class="text-muted mb-0">Registra, filtra y exporta tus gastos.</p>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-outline-primary" onclick="exportExpenses()">
                <i class="bi bi-download"></i> Exportar CSV
            </button>
            <a class="btn btn-primary" href="/new-expense.html">
                <i class="bi bi-plus-circle"></i> Nuevo gasto
            </a>
        </div>
    </div>

    <div id="successBox" class="alert alert-success py-2 d-none" role="status"></div>
    <div id="errorBox" class="alert alert-danger py-2 d-none" role="alert"></div>

    <!-- Filtros -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-2 align-items-end">
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1" for="filterFrom">Desde</label>
                    <input type="date" id="filterFrom" class="form-control form-control-sm">
                </div>
                <div class="col-md-2">
                    <label class="form-label small text-muted mb-1" for="filterTo">Hasta</label>
                    <input type="date" id="filterTo" class="form-control form-control-sm">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="filterCategory">Categoría</label>
                    <select id="filterCategory" class="form-select form-select-sm">
                        <option value="">Todas</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted mb-1" for="filterText">Buscar</label>
                    <input type="search" id="filterText" class="form-control form-control-sm"
                           placeholder="Descripción..." maxlength="255"
                           onkeydown="if (event.key === 'Enter') applyFilters()">
                </div>
                <div class="col-md-2 d-flex gap-2">
                    <button class="btn btn-primary btn-sm flex-grow-1" onclick="applyFilters()">
                        <i class="bi bi-funnel"></i> Filtrar
                    </button>
                    <button class="btn btn-outline-secondary btn-sm" onclick="clearFilters()"
                            title="Limpiar filtros" aria-label="Limpiar filtros">
                        <i class="bi bi-x-circle"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 responsive-table">
                    <thead class="table-light">
                    <tr>
                        <th style="width: 110px;">Fecha</th>
                        <th>Descripción</th>
                        <th style="width: 150px;">Categoría</th>
                        <th style="width: 230px;">Ubicación</th>
                        <th style="width: 130px;" class="text-end">Monto</th>
                        <th style="width: 160px;" class="text-end">Acciones</th>
                    </tr>
                    </thead>
                    <tbody id="expensesTable">
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">Cargando gastos...</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="card-footer bg-white d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="text-muted small" id="pageInfo">Página 1</div>
            <div>
                <button class="btn btn-sm btn-outline-secondary" id="prevBtn" onclick="prevPage()">
                    <i class="bi bi-chevron-left"></i> Anterior
                </button>
                <button class="btn btn-sm btn-outline-secondary" id="nextBtn" onclick="nextPage()">
                    Siguiente <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>
    </div>

</main>

<!-- Modal de comprobante -->
<div class="modal fade" id="receiptModal" tabindex="-1" aria-labelledby="receiptModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="receiptModalTitle">Comprobante del gasto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="receiptExpenseId">

                <div id="receiptExisting" class="alert alert-info py-2 d-none">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
                        <span class="small">
                            <i class="bi bi-paperclip"></i>
                            <span id="receiptNombre"></span>
                            <span class="text-muted" id="receiptTamano"></span>
                        </span>
                        <span class="d-flex gap-2">
                            <button type="button" class="btn btn-sm btn-outline-primary" onclick="viewReceipt()">
                                <i class="bi bi-eye"></i> Ver
                            </button>
                            <button type="button" class="btn btn-sm btn-outline-danger" onclick="deleteReceipt()">
                                <i class="bi bi-trash"></i> Quitar
                            </button>
                        </span>
                    </div>
                </div>
                <img id="receiptPreview" class="receipt-preview d-none mt-2" alt="Vista previa del comprobante">
                <p class="small text-muted" id="receiptEmpty">Este gasto todavía no tiene comprobante.</p>

                <form id="receiptForm" onsubmit="handleUploadReceipt(event)">
                    <div class="mb-3">
                        <label for="receiptFile" class="form-label">Adjuntar imagen o PDF</label>
                        <input type="file" id="receiptFile" class="form-control" required
                               accept="image/jpeg,image/png,image/webp,application/pdf"
                               capture="environment">
                        <div class="form-text">JPG, PNG, WebP o PDF. Máximo 5 MB. En móvil puedes tomar la foto.</div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="receiptUploadBtn">
                        <i class="bi bi-cloud-upload"></i> Subir comprobante
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/layout.js"></script>
<script src="/js/expenses.js"></script>
</body>
</html>
