spring.application.name=geogasto

# ===== DataSource =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== JWT =====
jwt.secret=EstaEsUnaClaveSecretaMuyLargaParaFirmarLosTokensJWTQueDebeTenerAlMenos256BitsDeLongitud
jwt.expiration=86400000

# ===== Server =====
server.port=8080

# ===== Geocoding (Nominatim) =====
nominatim.base-url=https://nominatim.openstreetmap.org
nominatim.user-agent=GeoGasto/1.0 (contacto@geogasto.com)

# ===== OpenAPI / Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs