spring.application.name=geogasto

# ===== DataSource =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.clean-disabled=true

# ===== JWT =====
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===== Paginación =====
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100

# ===== Server =====
server.port=8080
server.compression.enabled=true
server.forward-headers-strategy=framework
server.error.include-message=never
server.error.include-stacktrace=never

# ===== Geocoding (Nominatim) =====
nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
nominatim.user-agent=${NOMINATIM_USER_AGENT:GeoGasto/1.0 (https://github.com/diegomorantemz/geogasto)}
nominatim.min-interval-ms=${NOMINATIM_MIN_INTERVAL_MS:1000}
nominatim.cache-hours=${NOMINATIM_CACHE_HOURS:24}

# ===== App =====
app.seed-default-categories=${SEED_DEFAULT_CATEGORIES:true}

# ===== Rate limiting =====
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.max-requests=${RATE_LIMIT_MAX_REQUESTS:20}
rate-limit.window-seconds=${RATE_LIMIT_WINDOW_SECONDS:60}

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=GeoGasto
info.app.description=Administracion de gastos con ubicacion
info.app.version=@project.version@

# ===== OpenAPI / Swagger =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.default-produces-media-type=application/json
